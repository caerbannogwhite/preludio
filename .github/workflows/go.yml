# Build, vet and test every module in the repository.
#
# preludio is a multi-module repository: the root module (the CLI), the
# preludiocore module under src/, and the bytefeeder module under
# src/bytefeeder/. The Go version is taken from the root go.mod so it cannot
# drift from what the modules declare.
#
# src/prql2sas is deliberately left out: it is a standalone legacy module
# (go 1.19) that nothing else depends on.

name: Go

on:
  push:
    branches: ["main", "v0.4.0"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        module: [".", "src", "src/bytefeeder"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  gofmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"
